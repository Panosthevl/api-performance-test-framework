name: API & Performance Automation Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  api-testing:
    name: Run Pytest API Automation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest playwright python-dotenv
        playwright install

    - name: Execute API Tests
      run: pytest api_tests/

  performance-testing:
    name: Run k6 Performance Load Test
    runs-on: ubuntu-latest
    needs: api-testing

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup k6 CLI
      uses: grafana/setup-k6-action@v1

    - name: Run k6 Load Test
      uses: grafana/run-k6-action@v1
      with:
        path: performance_tests/load_test.js

